# Deploiement Netlify : le front est dans frontend/, Netlify y lance le build.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application a une page : toute adresse inconnue renvoie index.html,
# React Router prend le relais (/semaine, /etudes…).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker doit toujours etre relu, sinon les mises a jour tardent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Type exact du manifeste de la PWA (installation sur l'ecran d'accueil).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
